spring.application.name=board-experiment
server.port=${PORT:18081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/board_trial1}
spring.datasource.username=${DB_USER:board_trial1}
spring.datasource.password=${DB_PASSWORD:local-trial-only}
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
springdoc.swagger-ui.path=/swagger-ui.html
