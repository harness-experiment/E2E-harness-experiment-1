name: board-trial1
services:
  postgres:
    image: postgres:16-alpine
    container_name: board-trial1-db
    environment:
      POSTGRES_DB: board_trial1
      POSTGRES_USER: board_trial1
      POSTGRES_PASSWORD: local-trial-only
    ports: ['127.0.0.1:15433:5432']
    volumes: ['board-trial1-db:/var/lib/postgresql/data']
  prometheus:
    image: prom/prometheus:v2.47.0
    ports: ['127.0.0.1:19091:9090']
    volumes: ['./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
  grafana:
    image: grafana/grafana:10.1.0
    ports: ['127.0.0.1:13001:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
volumes:
  board-trial1-db:
    external: true
